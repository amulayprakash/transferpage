[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin Node to match local (TS 6 / Vite 8 / React 19 need a modern Node).
  NODE_VERSION = "22"

# SPA fallback: serve index.html for any path. Harmless for this single-page
# app today, and correct if client-side routes are added later.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
